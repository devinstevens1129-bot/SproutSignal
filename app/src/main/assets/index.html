const KEY='sproutsignal-v1';let data={plants:[],notices:[],journal:[]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.plants)&&Array.isArray(saved.notices)&&Array.isArray(saved.journal))data=saved}catch(e){}let tab='home',search='',category='All',selected=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Storage unavailable or full. Export a backup to protect your entries.')}}function dateNow(){return new Date().toISOString().slice(0,10)}function daysUntil(d){return Math.ceil((new Date(d+'T12:00:00')-new Date(new Date().toDateString()))/86400000)}function nav(t){tab=t;selected=null;render()}function menu(){const names=[['home','🏡','Home'],['knowledge','📚','Knowledge'],['plants','🪴','My Plants'],['notices','🔔','Notices'],['journal','📷','Journal'],['compare','🔬','Compare']];['topTabs','bottomTabs'].forEach(id=>$(id).innerHTML=names.map(([k,e,n])=>`<button class="${tab===k?'active':''}" onclick="nav('${k}')">${e} ${n}</button>`).join(''))}function render(){menu();let html='';if(tab==='home')html=home();if(tab==='knowledge')html=knowledge();if(tab==='plants')html=myPlants();if(tab==='notices')html=notices();if(tab==='journal')html=journal();if(tab==='compare')html=compare();$('app').innerHTML=html;if(tab==='knowledge'&&selected){const id=selected;setTimeout(()=>{if(selected===id)loadGallery(id)},0)}}function home(){const due=data.notices.filter(n=>!n.done&&daysUntil(n.date)<=0).length;return `<h2>Welcome to your growing space</h2><div class="grid three"><div class="metric"><span class="muted">My plants</span><strong>${data.plants.length}</strong></div><div class="metric"><span class="muted">Due notices</span><strong>${due}</strong></div><div class="metric"><span class="muted">Field notes</span><strong>${data.journal.length}</strong></div></div><div class="card"><h3>Start here</h3><p class="muted">Browse example plant profiles, add your plants, and create watering, feeding, or seasonal reminders.</p><div class="actionrow"><button class="primary" onclick="nav('knowledge')">Explore knowledge</button><button onclick="nav('plants')">Add a plant</button><button onclick="nav('notices')">Set a notice</button><button onclick="nav('compare')">Compare plants</button></div></div><div class="note"><b>Foraging safety:</b> Plant profiles describe documented food uses, not permission to eat a wild specimen. Never consume a plant based on an app, photo, or AI identification alone. Verify with qualified local expertise.</div><div class="card"><h3>Storage status</h3><p class="muted">Your entries save in this browser's local storage on this device. They are not cloud-synced. Export backups regularly; clearing browser data can erase them.</p><div class="actionrow"><button onclick="exportData()">⬇ Export backup</button><button onclick="$('importFile').click()">⬆ Import backup</button><input id="importFile" class="hide" type="file" accept="application/json" onchange="importData(event)"></div></div><div class="card"><h3>Development roadmap</h3><p class="muted">Photo identification, live weather alerts, push notifications, cloud sync, reviewed community contributions, and marketplace features require additional services and are not active in this prototype. Recurring reminders only update when you open and use this app.</p></div>`}function knowledge(){if(selected){let p=species.find(x=>x.id===selected);if(!p){selected=null;return knowledge()}return `<button onclick="selected=null;render()">← Back to library</button><div class="card"><div style="font-size:48px">${p.emoji}</div><h2>${esc(p.name)}</h2><i>${esc(p.scientific)}</i><p><span class="badge">${esc(p.category)}</span> <span class="badge">${esc(p.region)}</span></p><h3>Identification features</h3><p>${esc(p.idtips)}</p>${careDetails(p)}${photoGallery(p)}<h3>${p.category==='Houseplant'?'Edibility':'Documented food use'}</h3><p>${esc(p.part)}</p><h3>Cultivation</h3><p>${esc(p.cultivation)}</p><div class="note"><b>Safety:</b> ${esc(p.caution)} No automated edibility approval. References may support taxonomy without independently validating food preparation or safety; consult region-specific expert sources.</div>${p.source?`<p><a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">Botanical reference: Kew Plants of the World Online ↗</a></p>`:'<p class="muted">Illustrative care entry; source review pending.</p>'}<div class="actionrow"><button class="primary" onclick="addFromLibrary('${p.id}')">+ Add to My Plants</button><button onclick="compareA='${p.id}';nav('compare')">🔬 Compare with another plant</button></div></div>`}let arr=species.filter(p=>(category==='All'||p.category===category)&&(p.name+' '+p.scientific+' '+p.region).toLowerCase().includes(search.toLowerCase()));return `<h2>Plant Knowledge Center</h2><p class="muted">A starter reference library with multi-view photo comparison including pothos varieties, succulents, cacti, popular houseplants, cultivated herbs, and wild plants. Wild edible entries include botanical reference links; species-specific food-use and preparation claims require further editorial review.</p><div class="card"><div class="field"><label for="find">Search plants</label><input id="find" value="${esc(search)}" oninput="search=this.value;updateResults()" placeholder="Name, scientific name or region"></div><div class="field"><label for="cat">Category</label><select id="cat" onchange="category=this.value;updateResults()">${['All','Wild edible','Houseplant','Garden herb'].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="results">${results(arr)}</div></div><div class="note">⚠️ Edible-use references do not verify any specimen. Regional laws, contaminants, allergies, toxic lookalikes and processing requirements must be checked separately.</div>`}function photoGallery(p){return `<section aria-label="Botanical photo comparison"><h3>🔎 Photo comparison</h3><p class="muted">Compare the whole plant, leaves, stems and flowers or fruit. Images are retrieved from Wikimedia Commons when online; search results are not expert-verified and may include other species. Always check scientific names and image captions.</p><div class="photo-tools" id="photoTools"><button class="active" onclick="loadGallery('${p.id}','whole',this)">Whole plant</button><button onclick="loadGallery('${p.id}','leaf',this)">Leaves</button><button onclick="loadGallery('${p.id}','stem',this)">Stems</button><button onclick="loadGallery('${p.id}','flower fruit',this)">Flowers / fruit</button></div><div class="gallery-status" id="photoStatus">Loading reference photographs…</div><div class="photo-grid" id="photoGrid"></div><p class="muted">Photos require an internet connection. Photo comparisons support learning but cannot confirm identification or edibility.</p></section>`}
let compareA='golden-pothos',compareB='marble-queen-pothos';
const careOverrides={
'pothos':{light:'Bright indirect light; tolerates medium light',water:'Check upper 2–5 cm (1–2 in) of mix before watering',soil:'Airy potting mix with drainage',humidity:'Average indoor humidity; higher humidity can help',feed:'Light feeding during active growth; follow fertilizer label',prop:'Stem cuttings must include a node'},
'golden-pothos':{light:'Bright indirect light for variegation',water:'Check upper 2–5 cm (1–2 in) of mix',soil:'Airy draining mix',humidity:'Average household humidity',feed:'Diluted balanced feed during active growth',prop:'Node cuttings in water or potting mix'},
'marble-queen-pothos':{light:'Bright indirect light to retain marbling; avoid harsh direct sun',water:'Check upper 2–5 cm (1–2 in) of mix',soil:'Airy draining mix',humidity:'Average indoor humidity',feed:'Light feeding during active growth',prop:'Node cuttings; variegation may vary'},
'snake':{light:'Low to bright indirect light',water:'Allow mix to dry thoroughly; avoid fixed watering schedules',soil:'Gritty fast-draining mix',humidity:'Normal indoor humidity',feed:'Minimal fertilizer in growing season',prop:'Division; leaf cuttings may lose variegation'},
'aloe':{light:'Strong bright light; acclimate gradually',water:'Soak then let mix dry thoroughly',soil:'Mineral-rich cactus/succulent mix with drainage',humidity:'Low to average',feed:'Sparse feeding during active growth',prop:'Separate rooted offsets'},
'jade':{light:'Several hours of bright light, acclimated gradually',water:'Let soil dry thoroughly before watering',soil:'Fast-draining succulent mix',humidity:'Low to average',feed:'Occasional diluted feeding in active growth',prop:'Callused stem or leaf cuttings'},
'spider':{light:'Bright indirect light',water:'Check top soil; avoid prolonged waterlogging',soil:'General well-drained potting mix',humidity:'Average indoor humidity',feed:'Moderate feeding in growing season',prop:'Root plantlets from runners'}
};
function careDetails(p){if(p.category!=='Houseplant')return '';const c=careOverrides[p.id]||{light:'Use bright indirect light unless the species profile states otherwise',water:'Check actual soil moisture and drainage; do not rely on a fixed schedule',soil:'Match substrate and drainage to species',humidity:'Check species-specific humidity needs',feed:'Follow species-specific guidance and product label',prop:'Confirm propagation method for this species'};return `<details class="care-extra" open><summary><b>🪴 Detailed indoor care</b></summary><div class="care-grid">${Object.entries({Light:c.light,Water:c.water,Soil:c.soil,Humidity:c.humidity,Fertilizer:c.feed,Propagation:c.prop}).map(([k,v])=>`<div><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join('')}</div><p class="muted">General guidance only. Check pot weight, substrate and plant condition before watering.</p></details>`}
function compare(){const opts=species.map(p=>`<option value="${esc(p.id)}"`);const choose=(v,side)=>`<select onchange="compare${side}=this.value;render()">${species.map(p=>`<option value="${esc(p.id)}" ${v===p.id?'selected':''}>${esc(p.name)} (${esc(p.scientific)})</option>`).join('')}</select>`;const a=species.find(p=>p.id===compareA)||species[0],b=species.find(p=>p.id===compareB)||species[1];const panel=p=>`<div class="compare-panel"><div class="compare-emoji">${p.emoji}</div><h3>${esc(p.name)}</h3><i>${esc(p.scientific)}</i><p><span class="badge">${esc(p.category)}</span></p><b>Key features</b><p>${esc(p.idtips)}</p><b>Growing conditions</b><p>${esc(p.cultivation)}</p><b>Safety</b><p>${esc(p.caution)}</p><button onclick="selected='${p.id}';tab='knowledge';render()">Open photos &amp; full profile →</button></div>`;return `<h2>🔬 Compare two plants</h2><p class="muted">Compare identification traits, growing conditions and warnings side by side. Open each profile for multiple close-up photo searches.</p><div class="compare-select"><div class="field"><label>First plant</label>${choose(a.id,'A')}</div><div class="field"><label>Second plant</label>${choose(b.id,'B')}</div></div><div class="compare-grid">${panel(a)}${panel(b)}</div><div class="note"><b>Identification reminder:</b> This comparison does not establish species identity or food safety. Photo search results may be mislabeled.</div>`}
let galleryRequest=0;const photoCache={};async function loadGallery(id,part='whole',btn=null){const p=species.find(x=>x.id===id);if(!p||selected!==id)return;const token=++galleryRequest;if(btn){document.querySelectorAll('#photoTools button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}const grid=$('photoGrid'),status=$('photoStatus');if(!grid||!status)return;grid.innerHTML='';status.textContent='Loading '+part+' photos…';const key=id+'|'+part;try{let pics=photoCache[key];if(!pics){const terms=part==='whole'?p.scientific:p.scientific+' '+part;const params=new URLSearchParams({action:'query',generator:'search',gsrsearch:'filetype:bitmap '+terms,gsrnamespace:'6',gsrlimit:'16',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'680',format:'json',origin:'*'});const response=await fetch('https://commons.wikimedia.org/w/api.php?'+params.toString());if(!response.ok)throw Error('Photo service unavailable');const json=await response.json();pics=Object.values(json.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl).slice(0,8).map(x=>({title:x.title.replace(/^File:/,''),src:x.imageinfo[0].thumburl,full:x.imageinfo[0].url,source:x.imageinfo[0].descriptionurl}));photoCache[key]=pics}if(token!==galleryRequest||selected!==id||!$('photoGrid'))return;status.textContent=pics.length?pics.length+' reference images found — verify each caption and species.':'No images found for this view. Try another view.';grid.innerHTML=pics.map((x,i)=>`<figure class="photo-tile"><img loading="lazy" src="${esc(x.src)}" alt="Reference result: ${esc(x.title)}" onclick="openLightbox('${esc(key)}',${i})"><figcaption>${esc(x.title)}<div><a href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">Image details &amp; credit ↗</a></div></figcaption></figure>`).join('')}catch(e){if(token===galleryRequest&&$('photoStatus'))status.textContent='Could not load photos. Connect to the internet and try another view.'}}
function openLightbox(key,index){const x=photoCache[key]?.[index];if(!x)return;$('lightboxImg').src=x.full;$('lightboxCaption').textContent=x.title;$('lightboxSource').href=x.source;$('lightbox').classList.add('open')}
function closeLightbox(){$('lightbox').classList.remove('open');$('lightboxImg').removeAttribute('src')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
function results(arr){return arr.length?arr.map(p=>`<div class="plant-entry"><div class="row"><div><h3>${p.emoji} ${esc(p.name)}</h3><div class="muted"><i>${esc(p.scientific)}</i></div><div class="small">${esc(p.category)} · ${esc(p.region)}</div></div><button onclick="selected='${p.id}';render()">View →</button></div></div>`).join(''):'<div class="empty">No matching entries yet.</div>'}function updateResults(){let arr=species.filter(p=>(category==='All'||p.category===category)&&(p.name+' '+p.scientific+' '+p.region).toLowerCase().includes(search.toLowerCase()));$('results').innerHTML=results(arr)}function addFromLibrary(id){const p=species.find(x=>x.id===id);data.plants.push({id:crypto.randomUUID(),name:p.name,location:'Not specified',notes:'',added:dateNow()});save();nav('plants')}function addPlant(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;data.plants.unshift({id:crypto.randomUUID(),name,location:String(f.get('location')||''),notes:String(f.get('notes')||''),added:dateNow()});save();render()}function myPlants(){return `<h2>My Plants</h2><div class="card"><h3>Add a plant</h3><form onsubmit="addPlant(event)"><div class="field"><label>Plant name</label><input name="name" required maxlength="100" placeholder="e.g. Backyard salmonberry"></div><div class="field"><label>Location</label><input name="location" maxlength="100" placeholder="Kitchen window, raised bed, etc."></div><div class="field"><label>Care notes</label><textarea name="notes" maxlength="1000" placeholder="Light, soil, or observations"></textarea></div><button class="primary" type="submit">Save plant</button></form></div><div class="card"><h3>Saved collection (${data.plants.length})</h3>${data.plants.length?data.plants.map(p=>`<div class="plant-entry"><div class="row"><div><b>🪴 ${esc(p.name)}</b><div class="muted">${esc(p.location||'Location not set')}</div><div class="small">${esc(p.notes)}</div></div><button class="warn" onclick="removePlant('${p.id}')">Remove</button></div></div>`).join(''):'<div class="empty">No plants saved yet.</div>'}</div>`}function removePlant(id){if(confirm('Remove this plant?')){data.plants=data.plants.filter(p=>p.id!==id);save();render()}}function addNotice(e){e.preventDefault();const f=new FormData(e.target);data.notices.unshift({id:crypto.randomUUID(),title:String(f.get('title')),type:String(f.get('type')),date:String(f.get('date')),plant:String(f.get('plant')),repeat:Number(f.get('repeat')||0),done:false});save();render()}function toggleNotice(id){const n=data.notices.find(n=>n.id===id);if(n){if(!n.done&&Number(n.repeat)>0){const d=new Date(n.date+'T12:00:00');d.setDate(d.getDate()+Number(n.repeat));while(d.getTime()<new Date(dateNow()+'T12:00:00').getTime())d.setDate(d.getDate()+Number(n.repeat));n.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');n.completed=(n.completed||0)+1;n.done=false}else{n.done=!n.done}}save();render()}
function snoozeNotice(id){const n=data.notices.find(n=>n.id===id);if(n){const d=new Date(n.date+'T12:00:00');d.setDate(Math.max(Date.now(),d.getTime())+86400000);n.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}save();render()}function removeNotice(id){data.notices=data.notices.filter(n=>n.id!==id);save();render()}function notices(){let sorted=[...data.notices].sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date));return `<h2>Notice Center</h2><p class="muted">Scheduled in-app notices with repeat intervals and one-day snooze. Open this app to see what's due; background phone alerts are not enabled.</p><div class="card"><h3>Create reminder</h3><form onsubmit="addNotice(event)"><div class="field"><label>Task</label><input name="title" required maxlength="100" placeholder="Check soil moisture"></div><div class="grid"><div class="field"><label>Type</label><select name="type"><option>Watering</option><option>Feeding</option><option>Pruning</option><option>Repotting</option><option>Seasonal</option><option>Other</option></select></div><div class="field"><label>Due date</label><input name="date" type="date" required value="${dateNow()}"></div></div><div class="field"><label>Repeat</label><select name="repeat"><option value="0">One time</option><option value="1">Every day</option><option value="3">Every 3 days</option><option value="7">Every week</option><option value="14">Every 2 weeks</option><option value="30">Every 30 days</option></select></div><div class="field"><label>Plant (optional)</label><select name="plant"><option value="">General</option>${data.plants.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select></div><button class="primary">Add reminder</button></form></div><div class="card"><h3>Upcoming and completed</h3>${sorted.length?sorted.map(n=>`<div class="plant-entry"><div class="row"><div><b>${n.done?'✅':'🔔'} ${esc(n.title)}</b><div class="muted">${esc(n.type)} · ${esc(n.plant||'General')} · ${esc(n.date)} ${n.repeat?'· Every '+n.repeat+' day(s)':''} ${n.completed?'· Completed '+n.completed+' time(s)':''} ${!n.done&&daysUntil(n.date)<=0?'· DUE':''}</div></div><div class="actionrow"><button onclick="toggleNotice('${n.id}')">${n.repeat?'Complete & reschedule':n.done?'Undo':'Done'}</button><button onclick="snoozeNotice('${n.id}')">+1 day</button><button class="warn" onclick="removeNotice('${n.id}')">✕</button></div></div></div>`).join(''):'<div class="empty">No reminders yet.</div>'}</div><div class="note">Weather alerts will require a weather service, location permissions, notification delivery and a backend. This version does not monitor forecasts.</div>`}function addJournal(e){e.preventDefault();const f=new FormData(e.target);data.journal.unshift({id:crypto.randomUUID(),title:String(f.get('title')),body:String(f.get('body')),date:dateNow()});save();render()}function journal(){return `<h2>Field & Growth Journal</h2><p class="muted">Record what you grow or discover. Notes are private to this browser in this version.</p><div class="card"><form onsubmit="addJournal(event)"><div class="field"><label>Observation title</label><input name="title" required maxlength="100" placeholder="First strawberry flowers"></div><div class="field"><label>Notes</label><textarea name="body" required maxlength="3000" placeholder="Where it grows, changes, questions, or care results"></textarea></div><button class="primary">Save observation</button></form></div><div class="card"><h3>My observations</h3>${data.journal.length?data.journal.map(j=>`<div class="plant-entry"><div class="row"><b>${esc(j.title)}</b><span class="muted">${esc(j.date)}</span></div><p>${esc(j.body)}</p><button class="warn" onclick="removeJournal('${j.id}')">Delete</button></div>`).join(''):'<div class="empty">No observations recorded.</div>'}</div>`}function removeJournal(id){data.journal=data.journal.filter(j=>j.id!==id);save();render()}function exportData(){const blob=new Blob([JSON.stringify({app:'SproutSignal',version:3,exported:new Date().toISOString(),...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sproutsignal-backup-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!Array.isArray(x.plants)||!Array.isArray(x.notices)||!Array.isArray(x.journal))throw Error('Invalid backup');if(!confirm('Replace your current saved plants, notices and journal with this backup?'))return;data={plants:x.plants,notices:x.notices,journal:x.journal};save();render();alert('Backup imported')}catch(err){alert('Could not import: '+err.message)}}render();
</script></body></html>
